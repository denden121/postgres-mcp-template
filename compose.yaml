services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_admin_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/migrations/002_shop.sql:/docker-entrypoint-initdb.d/02-shop.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 2s
      timeout: 3s
      retries: 30
