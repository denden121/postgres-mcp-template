name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: docker compose up -d --wait
      - run: uv run pytest -q
        env:
          DATABASE_URL: postgresql://mcp_reader:local_reader_demo@127.0.0.1:55432/sales
      - if: always()
        run: docker compose down -v
