[project]
name = "postgres-mcp-template"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
